<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<title>Pendaftaran Kegiatan — PC IAI Kabupaten Grobogan</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#16834f,#075d38);
  color:#222;
  min-height:100vh;
}

.container{
  width:min(900px,calc(100% - 24px));
  margin:0 auto;
  padding:28px 0 50px;
}

.header{
  text-align:center;
  color:white;
  margin-bottom:24px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:700;
}

.header p{
  margin:8px 0 0;
  font-size:16px;
  opacity:.95;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
}

.page-title{
  margin:0;

}

.page-subtitle{

}

  display:grid;

}

  transform:translateY(-3px);

}

  opacity:.78;
}

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  margin-bottom:14px;

.event-icon{
  width:52px;
  height:52px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e9f7ef;
  font-size:26px;

}

.status{

  align-items:center;
  gap:5px;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;

}

.status-open{
  background:#e7f7ed;
  color:#16834f;

.status-closed{

}

.event-card h2{

.event-info{

  margin-right:4px;
}

.event-description{
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin-top:10px;
}

.btn{
  width:100%;
  border:none;
  border-radius:10px;
  padding:13px 16px;
  margin-top:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  display:block;
}

.btn-primary{
  background:#16834f;
  color:#fff;
}

.btn-primary:hover{
  background:#116b40;
}

.btn-secondary{
  background:#eaf5ef;
  color:#16834f;
}

.btn-secondary:hover{
  background:#dcefe6;
}

.btn-disabled{
  background:#ececec;
  color:#888;
  cursor:not-allowed;
}

.back-link{
  display:inline-block;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  margin:4px 0 14px;
}

.back-link:hover{
  text-decoration:underline;
}

.event-title{
  color:#16834f;
  font-size:24px;
  font-weight:700;
  margin-bottom:16px;
  line-height:1.35;
}

.search-box{
  display:flex;
  gap:10px;
}

input,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid #d5d5d5;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#16834f;
  box-shadow:0 0 0 3px rgba(22,131,79,.10);
}

.search-box button{
  width:auto;
  min-width:95px;
  margin:0;
}

.result{
  margin-top:15px;
}

.result-item{
  border:1px solid #e1e1e1;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.result-name{
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-top:7px;
}

.badge-polling{
  background:#e5f6ed;
  color:#16834f;
}

.badge-terdaftar{
  background:#eee;
  color:#555;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:600;
}

.required{
  color:#d93025;
}

.help{
  font-size:12px;
  color:#777;
  margin-top:5px;
}

.hidden{
  display:none !important;
}

.alert{
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
  line-height:1.45;
}

.alert-info{
  background:#eef6ff;
  color:#24527a;
}

.alert-success{
  background:#e7f7ed;
  color:#146c3a;
}

.alert-error{
  background:#fdecec;
  color:#a61b1b;
}

.loading{
  text-align:center;
  padding:30px 15px;
  color:#666;
}

.empty{
  text-align:center;
  padding:35px 20px;
  color:#666;
}

.empty .emoji{
  font-size:40px;
  margin-bottom:10px;
}

.error-card{
  background:#fff;
  border-radius:20px;
  padding:25px;
  color:#a61b1b;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
}

.form-actions{
  margin-top:8px;
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

@media(max-width:600px){

  .container{
    width:calc(100% - 16px);
    padding-top:18px;
  }

  .header h1{
    font-size:24px;
  }

  .card{
    padding:18px;
    border-radius:16px;
  }

  .page-title{
    font-size:21px;
  }

  .event-title{
    font-size:20px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    width:100%;
  }

  .result-item{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      📝 Pendaftaran Kegiatan
    </h1>

    <p>
      PC IAI Kabupaten Grobogan
    </p>

  </div>

  <div id="app">

    <div class="card loading">
      ⏳ Memuat kegiatan...
    </div>

  </div>

</div>


<script>

/* =====================================================
 * KONFIGURASI
 * ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzQJl6ixktTvRMz1F4rXiyEWHfAWP6O6U8divvmlH8gSD1oLBjiqlET6wq6ikI1F0XflQ/exec';


/* =====================================================
 * FORMAT TANGGAL TAMPILAN
 * Hanya menampilkan tanggal, tanpa jam.
 * Contoh: 26/09/2026 00:00:00 -> 26/09/2026
 * ===================================================== */

function formatTanggalTampil(value){

  if(!value){
    return '';
  }

  const text =
    String(value).trim();

  const match =
    text.match(/^(\d{1,2}\/\d{1,2}\/\d{4})/);

  if(match){
    return match[1];
  }

  return text;

}


/* =====================================================
 * PARAMETER
 *
 * Tanpa ?event=...
 *   -> tampilkan daftar semua kegiatan pendaftaran
 *
 * Dengan ?event=...
 *   -> tampilkan formulir kegiatan tersebut
 * ===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const ID_EVENT =
  String(
    params.get('event') ||
    params.get('id_event') ||
    ''
  ).trim();


let EVENT_DATA = null;

let sedangMengirimPendaftaran =
  false;


const app =
  document.getElementById('app');


/* =====================================================
 * API GET YANG AMAN
 *
 * Jika Apps Script mengembalikan HTML/404,
 * tampilkan pesan yang jelas, bukan:
 * "Unexpected token <"
 * ===================================================== */

async function apiGet(
  action,
  extra = ''
){

  const url =
    API_URL +
    '?action=' +
    encodeURIComponent(action) +
    extra;

  const response =
    await fetch(url, {
      method:'GET',
      cache:'no-store'
    });

  const text =
    await response.text();

  let result;

  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      'API tidak mengembalikan JSON. ' +
      'Periksa deployment Web App Apps Script.'
    );

  }

  return result;

}


/* =====================================================
 * API POST
 * ===================================================== */

async function apiPost(
  payload
){

  const response =
    await fetch(
      API_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(payload)
      }
    );

  const text =
    await response.text();

  let result;

  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      'API tidak mengembalikan JSON setelah pengiriman. ' +
      'Periksa deployment Web App Apps Script.'
    );

  }

  return result;

}


/* =====================================================
 * HALAMAN AWAL
 *
 * SATU LINK UNTUK SEMUA KEGIATAN
 * ===================================================== */

async function loadPendaftaranEvents(){

  app.innerHTML = `
    <div class="card loading">
      ⏳ Memuat daftar kegiatan pendaftaran...
    </div>
  `;

  try{

    const result =
      await apiGet(
        'pendaftaran_events'
      );

    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        'Gagal memuat daftar kegiatan.'
      );

    }

    const events =
      Array.isArray(result.data)
        ? result.data
        : [];


    if(
      events.length === 0
    ){

      app.innerHTML = `
        <div class="card empty">

          <div class="emoji">
            📭
          </div>

          <strong>
            Belum ada kegiatan pendaftaran.
          </strong>

          <p>
            Silakan kembali lagi nanti.
          </p>

        </div>
      `;

      return;

    }


    let html = `

      <div class="card">

        <h2 class="page-title">
          Pilih Kegiatan
        </h2>

        <p class="page-subtitle">
          Silakan pilih kegiatan yang ingin Anda ikuti.
          Anda hanya perlu menggunakan satu link pendaftaran ini.
        </p>

      </div>

      <div class="event-grid">
    `;


    events.forEach(
      function(item){

        const idEvent =
          String(
            item.ID_EVENT || ''
          ).trim();

        const judul =
          item.JUDUL ||
          'Tanpa Judul';

        const tanggal =
          formatTanggalTampil(
            item.TANGGAL || ''
          );

        const waktu =
          item.WAKTU || '';

        const tempat =
          item.TEMPAT || '';

        const batasDaftar =
          formatTanggalTampil(
            item.BATAS_DAFTAR || ''
          );

        const deskripsi =
          item.DESKRIPSI || '';

        const status =
          String(
            item.STATUS_AKTUAL ||
            item.STATUS_PENDAFTARAN ||
            'DITUTUP'
          )
          .trim()
          .toUpperCase();

        const dibuka =
          status === 'DIBUKA';


        const tampilTanggal =
          String(
            item.TAMPIL_TANGGAL ||
            'YA'
          )
          .trim()
          .toUpperCase() === 'YA';


        const tampilWaktu =
          String(
            item.TAMPIL_WAKTU ||
            'YA'
          )
          .trim()
          .toUpperCase() === 'YA';


        const tampilTempat =
          String(
            item.TAMPIL_TEMPAT ||
            'YA'
          )
          .trim()
          .toUpperCase() === 'YA';


        let info = '';


        if(
          tampilTanggal &&
          tanggal
        ){

          info += `
            <div class="event-info">
              📅
              <strong>Tanggal:</strong>
              ${escapeHtml(tanggal)}
            </div>
          `;

        }


        if(
          tampilWaktu &&
          waktu &&
          waktu !== '-'
        ){

          info += `
            <div class="event-info">
              🕐
              <strong>Waktu:</strong>
              ${escapeHtml(waktu)}
            </div>
          `;

        }


        if(
          tampilTempat &&
          tempat &&
          tempat !== '-'
        ){

          info += `
            <div class="event-info">
              📍
              <strong>Tempat:</strong>
              ${escapeHtml(tempat)}
            </div>
          `;

        }


        if(
          batasDaftar &&
          batasDaftar !== '-'
        ){

          info += `
            <div class="event-info">
              ⏳
              <strong>Batas Pendaftaran:</strong>
              ${escapeHtml(batasDaftar)}
            </div>
          `;

        }


        const statusHtml =
          dibuka

            ? `
              <span class="status status-open">
                🟢 Pendaftaran Dibuka
              </span>
            `

            : `
              <span class="status status-closed">
                🔴 Pendaftaran Ditutup
              </span>
            `;


        const buttonHtml =
          dibuka

            ? `
              <a
                class="btn btn-primary"
                href="?event=${encodeURIComponent(idEvent)}"
              >
                Daftar Kegiatan →
              </a>
            `

            : `
              <button
                class="btn btn-disabled"
                type="button"
                disabled
              >
                Pendaftaran Ditutup
              </button>
            `;


        html += `

          <div
            class="event-card ${
              dibuka ? '' : 'closed'
            }"
          >

            <div class="event-top">

              <div class="event-icon">
                📋
              </div>

              ${statusHtml}

            </div>


            <h2>
              ${escapeHtml(judul)}
            </h2>


            ${info}


            ${
              deskripsi
              ?
              `
                <div class="event-description">
                  ${escapeHtml(deskripsi)}
                </div>
              `
              :
              ''
            }


            ${buttonHtml}

          </div>

        `;

      }
    );


    html += `
      </div>
    `;


    app.innerHTML =
      html;


  }catch(error){

    app.innerHTML = `

      <div class="error-card">

        ❌
        <strong>
          Gagal memuat daftar kegiatan.
        </strong>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

        <button
          class="btn btn-primary"
          type="button"
          onclick="loadPendaftaranEvents()"
        >
          Coba Lagi
        </button>

      </div>

    `;

    console.error(
      'LOAD PENDAFTARAN EVENTS ERROR:',
      error
    );

  }

}


/* =====================================================
 * HALAMAN FORM PENDAFTARAN
 * ===================================================== */

async function loadEvent(){

  if(!ID_EVENT){

    /*
     * TIDAK ADA ID EVENT:
     * jangan tampilkan error.
     * Tampilkan daftar kegiatan.
     */

    loadPendaftaranEvents();

    return;

  }


  try{

    const result =
      await apiGet(
        'pendaftaran',
        '&id_event=' +
        encodeURIComponent(
          ID_EVENT
        )
      );


    if(
      !result.success ||
      !result.event
    ){

      throw new Error(
        result.message ||
        'Kegiatan tidak ditemukan.'
      );

    }


    EVENT_DATA =
      result.event;


    renderRegistrationPage(
      EVENT_DATA
    );


  }catch(error){

    app.innerHTML = `

      <div class="error-card">

        ❌
        <strong>
          Kegiatan tidak ditemukan.
        </strong>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

        <a
          href="./"
          class="btn btn-primary"
        >
          ← Kembali ke Daftar Kegiatan
        </a>

      </div>

    `;

    console.error(
      'LOAD PENDAFTARAN EVENT ERROR:',
      error
    );

  }

}


/* =====================================================
 * RENDER FORM
 * ===================================================== */

function renderRegistrationPage(
  eventData
){

  const tanggal =
    formatTanggalTampil(
      eventData.TANGGAL || ''
    );

  const waktu =
    eventData.WAKTU || '';

  const tempat =
    eventData.TEMPAT || '';

  const batasDaftar =
    formatTanggalTampil(
      eventData.BATAS_DAFTAR || ''
    );

  const deskripsi =
    eventData.DESKRIPSI || '';

  const logo =
    eventData.LOGO || '';


  const tampilTanggal =
    String(
      eventData.TAMPIL_TANGGAL ||
      'YA'
    )
    .trim()
    .toUpperCase() === 'YA';


  const tampilWaktu =
    String(
      eventData.TAMPIL_WAKTU ||
      'YA'
    )
    .trim()
    .toUpperCase() === 'YA';


  const tampilTempat =
    String(
      eventData.TAMPIL_TEMPAT ||
      'YA'
    )
    .trim()
    .toUpperCase() === 'YA';


  const pendaftaranDibuka =
    String(
      eventData.STATUS_AKTUAL ||
      'DITUTUP'
    )
    .trim()
    .toUpperCase() === 'DIBUKA';


  let infoHtml = '';


  if(
    tampilTanggal &&
    tanggal
  ){

    infoHtml += `
      <div class="event-info">
        📅
        <strong>Tanggal:</strong>
        ${escapeHtml(tanggal)}
      </div>
    `;

  }


  if(
    tampilWaktu &&
    waktu &&
    waktu !== '-'
  ){

    infoHtml += `
      <div class="event-info">
        🕐
        <strong>Waktu:</strong>
        ${escapeHtml(waktu)}
      </div>
    `;

  }


  if(
    tampilTempat &&
    tempat &&
    tempat !== '-'
  ){

    infoHtml += `
      <div class="event-info">
        📍
        <strong>Tempat:</strong>
        ${escapeHtml(tempat)}
      </div>
    `;

  }


  if(
    batasDaftar &&
    batasDaftar !== '-'
  ){

    infoHtml += `
      <div class="event-info">
        ⏳
        <strong>Batas Pendaftaran:</strong>
        ${escapeHtml(batasDaftar)}
      </div>
    `;

  }


  const logoHtml =
    logo &&
    /^https?:\/\//i.test(
      String(logo)
    )

      ? `
        <div style="text-align:center;margin-bottom:14px;">
          <img
            src="${escapeHtml(logo)}"
            alt=""
            style="max-width:110px;max-height:110px;object-fit:contain;"
            onerror="this.style.display='none';"
          >
        </div>
      `

      : '';


  app.innerHTML = `

    <a
      href="./"
      class="back-link"
    >
      ← Kembali ke Daftar Kegiatan
    </a>


    <div class="card">

      ${logoHtml}

      <div class="event-title">
        ${escapeHtml(
          eventData.JUDUL ||
          'Pendaftaran Kegiatan'
        )}
      </div>


      ${infoHtml}


      ${
        deskripsi
        ?
        `
          <div class="event-description">
            ${escapeHtml(deskripsi)}
          </div>
        `
        :
        ''
      }


      <div style="margin-top:15px;">

        ${
          pendaftaranDibuka

          ?

          `
            <div class="alert alert-success">
              🟢 Pendaftaran untuk kegiatan ini sedang dibuka.
            </div>
          `

          :

          `
            <div class="alert alert-error">
              🔴 Pendaftaran untuk kegiatan ini sudah ditutup.
            </div>
          `
        }

      </div>

    </div>


    ${
      pendaftaranDibuka
      ?

      `

      <div class="card">

        <h2>
          🔎 Cari Nama Peserta
        </h2>

        <p>
          Nama dapat dicari dari peserta yang
          sebelumnya telah mengisi polling.
          Jika tidak ditemukan, Anda tetap dapat
          mendaftarkan peserta baru.
        </p>


        <div class="search-box">

          <input
            id="keyword"
            type="text"
            placeholder="Ketik nama peserta..."
            autocomplete="off"
          >

          <button
            id="searchButton"
            class="btn-secondary"
            type="button"
            onclick="cariNama()"
          >
            Cari
          </button>

        </div>


        <div id="searchResult" class="result"></div>

      </div>


      <div
        id="formCard"
        class="card hidden"
      >

        <h2>
          📝 Data Pendaftaran
        </h2>

        <div id="formMessage"></div>


        <form
          id="registrationForm"
        >

          <div
            id="groupNIK"
            class="form-group"
          >

            <label>
              NIK
              <span class="required">*</span>
            </label>

            <input
              id="nik"
              type="text"
              inputmode="numeric"
              maxlength="16"
              placeholder="Masukkan NIK 16 digit"
            >

            <div class="help">
              NIK harus terdiri dari 16 digit angka.
            </div>

          </div>


          <div
            id="groupEmail"
            class="form-group"
          >

            <label>
              Email
              <span class="required">*</span>
            </label>

            <input
              id="email"
              type="email"
              placeholder="contoh@email.com"
            >

          </div>


          <div class="form-group">

            <label>
              Nama Lengkap Sesuai Akun SATUSEHAT
              <span class="required">*</span>
            </label>

            <input
              id="nama"
              type="text"
              placeholder="Nama lengkap tanpa gelar"
              required
            >

            <div class="help">
              Gunakan nama sesuai akun SATUSEHAT.
            </div>

          </div>


          <div
            id="groupAsalPC"
            class="form-group"
          >

            <label>
              Asal Pengurus Cabang
            </label>

            <input
              id="asalPC"
              type="text"
              placeholder="Asal Pengurus Cabang"
            >

          </div>


          <div
            id="groupInstansi"
            class="form-group"
          >

            <label>
              Nama Instansi
            </label>

            <input
              id="instansi"
              type="text"
              placeholder="Nama instansi"
            >

          </div>


          <div
            id="groupPembayaran"
            class="form-group"
          >

            <label>
              Bukti Pembayaran
            </label>

            <input
              id="buktiPembayaran"
              type="file"
              accept="image/jpeg,image/png,image/webp,application/pdf"
            >

            <div class="help">
              Format JPG, PNG, WEBP, atau PDF. Maksimal 5 MB.
            </div>

          </div>


          <div class="form-actions">

            <button
              id="submitButton"
              type="submit"
              class="btn btn-primary"
            >
              Kirim Pendaftaran
            </button>

          </div>

        </form>

      </div>

      `

      :

      ''

    }

  `;


  /*
   * Konfigurasi field berdasarkan EVENT.
   */

  toggleField(
    'groupNIK',
    eventData.TAMPIL_NIK
  );

  setFieldRequired(
    'groupNIK',
    eventData.TAMPIL_NIK
  );


  toggleField(
    'groupEmail',
    eventData.TAMPIL_EMAIL
  );

  setFieldRequired(
    'groupEmail',
    eventData.TAMPIL_EMAIL
  );


  toggleField(
    'groupAsalPC',
    eventData.TAMPIL_ASAL_PC
  );


  toggleField(
    'groupInstansi',
    eventData.TAMPIL_INSTANSI
  );


  toggleField(
    'groupPembayaran',
    eventData.TAMPIL_PEMBAYARAN
  );


  /*
   * PENTING:
   * Tidak lagi menggunakan:
   *
   * onsubmit="submitPendaftaran(event)"
   *
   * sehingga tidak ada lagi error:
   * "event is not defined".
   */

  const form =
    document.getElementById(
      'registrationForm'
    );

  if(form){

    form.addEventListener(
      'submit',
      submitPendaftaran
    );

  }

}


/* =====================================================
 * CARI NAMA
 * ===================================================== */

async function cariNama(){

  const keywordInput =
    document.getElementById(
      'keyword'
    );

  const resultBox =
    document.getElementById(
      'searchResult'
    );

  const searchButton =
    document.getElementById(
      'searchButton'
    );


  if(
    !keywordInput ||
    !resultBox
  ){
    return;
  }


  const keyword =
    keywordInput.value.trim();


  if(
    keyword.length < 2
  ){

    resultBox.innerHTML = `
      <div class="alert alert-info">
        Ketik minimal 2 huruf nama.
      </div>
    `;

    return;

  }


  resultBox.innerHTML = `
    <div class="alert alert-info">
      🔎 Mencari nama...
    </div>
  `;


  if(searchButton){
    searchButton.disabled = true;
  }


  try{

    const result =
      await apiGet(
        'cari_pendaftar',
        '&id_event=' +
        encodeURIComponent(
          ID_EVENT
        ) +
        '&keyword=' +
        encodeURIComponent(
          keyword
        )
      );


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        'Gagal melakukan pencarian.'
      );

    }


    if(
      !Array.isArray(
        result.data
      ) ||
      result.data.length === 0
    ){

      resultBox.innerHTML = `

        <div class="alert alert-info">

          Nama tidak ditemukan dari hasil polling.

          <br><br>

          Anda tetap dapat melakukan pendaftaran
          sebagai peserta baru.

          <br><br>

          <button
            class="btn btn-secondary"
            type="button"
            onclick="pesertaBaru()"
          >
            + Daftarkan Peserta Baru
          </button>

        </div>

      `;

      return;

    }


    resultBox.innerHTML =
      result.data
        .map(
          function(item){

            const nama =
              item.NAMA || '';

            const sudah =
              item.SUDAH_TERDAFTAR === true;


            return `

              <div class="result-item">

                <div>

                  <div class="result-name">
                    ${escapeHtml(nama)}
                  </div>

                  <span
                    class="badge ${
                      sudah
                        ? 'badge-terdaftar'
                        : 'badge-polling'
                    }"
                  >
                    ${
                      sudah
                        ? '✓ Sudah Terdaftar'
                        : '✓ Ditemukan dari Polling'
                    }
                  </span>

                </div>


                ${
                  sudah
                    ? ''

                    : `
                      <button
                        class="btn-secondary"
                        type="button"
                        onclick='pilihNama(${JSON.stringify(nama)})'
                      >
                        Pilih Nama
                      </button>
                    `
                }

              </div>

            `;

          }
        )
        .join('');


  }catch(error){

    resultBox.innerHTML = `

      <div class="alert alert-error">
        ${escapeHtml(
          error.message
        )}
      </div>

    `;

  }finally{

    if(searchButton){
      searchButton.disabled = false;
    }

  }

}


/* =====================================================
 * PESERTA BARU
 * ===================================================== */

function pesertaBaru(){

  const formCard =
    document.getElementById(
      'formCard'
    );

  const nama =
    document.getElementById(
      'nama'
    );


  if(!formCard){
    return;
  }


  formCard.classList.remove(
    'hidden'
  );


  if(nama){

    nama.value = '';

    nama.focus();

  }


  formCard.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });

}


/* =====================================================
 * PILIH NAMA
 * ===================================================== */

function pilihNama(
  namaPeserta
){

  const formCard =
    document.getElementById(
      'formCard'
    );

  const nama =
    document.getElementById(
      'nama'
    );


  if(!formCard || !nama){
    return;
  }


  formCard.classList.remove(
    'hidden'
  );


  nama.value =
    namaPeserta || '';


  nama.focus();


  formCard.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });

}


/* =====================================================
 * SUBMIT PENDAFTARAN
 *
 * Perubahan penting:
 * - Parameter bernama e, bukan event.
 * - Dipanggil melalui addEventListener.
 * - Tidak ada lagi inline onsubmit="...event..."
 * ===================================================== */

async function submitPendaftaran(e){

  if(e){
    e.preventDefault();
  }


  if(
    sedangMengirimPendaftaran
  ){
    return;
  }


  sedangMengirimPendaftaran =
    true;


  const nikInput =
    document.getElementById(
      'nik'
    );

  const emailInput =
    document.getElementById(
      'email'
    );

  const namaInput =
    document.getElementById(
      'nama'
    );

  const asalPCInput =
    document.getElementById(
      'asalPC'
    );

  const instansiInput =
    document.getElementById(
      'instansi'
    );

  const submitButton =
    document.getElementById(
      'submitButton'
    );


  const nik =
    nikInput
      ? nikInput.value.trim()
      : '';

  const email =
    emailInput
      ? emailInput.value.trim()
      : '';

  const nama =
    namaInput
      ? namaInput.value.trim()
      : '';

  const asalPC =
    asalPCInput
      ? asalPCInput.value.trim()
      : '';

  const instansi =
    instansiInput
      ? instansiInput.value.trim()
      : '';


  const inputBukti =
    document.getElementById(
      'buktiPembayaran'
    );


  let fileBukti =
    null;


  if(
    inputBukti &&
    inputBukti.files &&
    inputBukti.files.length > 0
  ){

    fileBukti =
      inputBukti.files[0];

  }


  /*
   * Validasi berdasarkan konfigurasi EVENT.
   * Jangan memaksa NIK jika TAMPIL_NIK = TIDAK.
   */

  const tampilNIK =
    String(
      EVENT_DATA &&
      EVENT_DATA.TAMPIL_NIK ||
      ''
    )
    .trim()
    .toUpperCase() === 'YA';


  const tampilEmail =
    String(
      EVENT_DATA &&
      EVENT_DATA.TAMPIL_EMAIL ||
      ''
    )
    .trim()
    .toUpperCase() === 'YA';


  if(
    !nama
  ){

    showMessage(
      'formMessage',
      'Nama lengkap wajib diisi.',
      'error'
    );

    sedangMengirimPendaftaran =
      false;

    return;

  }


  if(
    tampilNIK &&
    !/^\d{16}$/.test(nik)
  ){

    showMessage(
      'formMessage',
      'NIK harus terdiri dari 16 digit angka.',
      'error'
    );

    sedangMengirimPendaftaran =
      false;

    return;

  }


  if(
    tampilEmail &&
    !email
  ){

    showMessage(
      'formMessage',
      'Email wajib diisi.',
      'error'
    );

    sedangMengirimPendaftaran =
      false;

    return;

  }


  if(
    submitButton
  ){

    submitButton.disabled =
      true;

    submitButton.textContent =
      '⏳ Menyimpan...';

  }


  try{

    let fileData =
      null;


    if(fileBukti){

      if(
        fileBukti.size >
        5 * 1024 * 1024
      ){

        throw new Error(
          'Ukuran bukti pembayaran maksimal 5 MB.'
        );

      }


      const allowedTypes = [

        'image/jpeg',

        'image/png',

        'image/webp',

        'application/pdf'

      ];


      if(
        allowedTypes.indexOf(
          fileBukti.type
        ) === -1
      ){

        throw new Error(
          'Format bukti pembayaran harus JPG, PNG, WEBP, atau PDF.'
        );

      }


      fileData =
        await bacaFileBase64(
          fileBukti
        );

    }


    const data = {

      ID_EVENT:
        ID_EVENT,

      NIK:
        nik,

      EMAIL:
        email,

      NAMA:
        nama,

      ASAL_PC:
        asalPC,

      INSTANSI:
        instansi,

      BUKTI_PEMBAYARAN_FILE:
        fileData

    };


    const result =
      await apiPost({

        action:
          'simpan',

        data:
          data

      });


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        'Pendaftaran gagal.'
      );

    }


    showMessage(
      'formMessage',
      '✅ Pendaftaran berhasil disimpan. Terima kasih.',
      'success'
    );


    const form =
      document.getElementById(
        'registrationForm'
      );

    if(form){
      form.reset();
    }


    if(
      submitButton
    ){

      submitButton.disabled =
        true;

      submitButton.textContent =
        'Pendaftaran Berhasil';

    }


  }catch(error){

    showMessage(
      'formMessage',
      error.message ||
      'Pendaftaran gagal.',
      'error'
    );


    if(
      submitButton
    ){

      submitButton.disabled =
        false;

      submitButton.textContent =
        'Kirim Pendaftaran';

    }

  }finally{

    sedangMengirimPendaftaran =
      false;

  }

}


/* =====================================================
 * BACA FILE BASE64
 * ===================================================== */

function bacaFileBase64(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            String(
              reader.result || ''
            );


          const commaIndex =
            result.indexOf(',');


          if(
            commaIndex === -1
          ){

            reject(
              new Error(
                'File tidak dapat dibaca.'
              )
            );

            return;

          }


          resolve({

            name:
              file.name,

            mimeType:
              file.type,

            base64:
              result.substring(
                commaIndex + 1
              )

          });

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              'Gagal membaca file.'
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
 * TOGGLE FIELD
 * ===================================================== */

function toggleField(
  id,
  status
){

  const element =
    document.getElementById(
      id
    );


  if(!element){
    return;
  }


  const input =
    element.querySelector(
      'input,select,textarea'
    );


  const tampil =
    String(
      status || ''
    )
    .trim()
    .toUpperCase() === 'YA';


  if(tampil){

    element.classList.remove(
      'hidden'
    );

    if(input){
      input.disabled = false;
    }

  }else{

    element.classList.add(
      'hidden'
    );

    if(input){

      input.disabled =
        true;

      input.required =
        false;

      input.value =
        '';

    }

  }

}


function setFieldRequired(
  id,
  status
){

  const element =
    document.getElementById(
      id
    );


  if(!element){
    return;
  }


  const input =
    element.querySelector(
      'input,select,textarea'
    );


  if(!input){
    return;
  }


  input.required =
    String(
      status || ''
    )
    .trim()
    .toUpperCase() === 'YA';

}


/* =====================================================
 * MESSAGE
 * ===================================================== */

function showMessage(
  id,
  text,
  type
){

  const element =
    document.getElementById(
      id
    );


  if(!element){
    return;
  }


  element.innerHTML = `

    <div class="alert alert-${type}">
      ${escapeHtml(text)}
    </div>

  `;

}


/* =====================================================
 * ESCAPE HTML
 * ===================================================== */

function escapeHtml(
  value
){

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}

}else{

  loadPendaftaranEvents();

}
